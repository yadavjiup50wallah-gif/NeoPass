<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background: #ffffff;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
      color: #1a1a1a;
    }
    .section {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    .section-title {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-value {
      font-weight: bold;
      font-size: 14px;
    }
    .status-active { color: #2e7d32; }
    .status-inactive { color: #c62828; }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      padding: 8px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      flex: 1;
    }
    button:hover {
      background: #1565c0;
    }
    button.secondary {
      background: #757575;
    }
    button.secondary:hover {
      background: #616161;
    }
    button.success {
      background: #2e7d32;
    }
    .screenshot-preview {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 8px;
      display: none;
    }
    .info {
      font-size: 11px;
      color: #757575;
      margin-top: 10px;
      line-height: 1.4;
    }
    .tab-status {
      font-size: 11px;
      color: #444;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <h1>NeoPass: Exam Cockpit</h1>
  
  <div class="section">
    <div class="section-title">Bypass Status</div>
    <div class="status-container">
      <span>Neocolab Bypass</span>
      <span id="bypassStatus" class="status-value status-active">ACTIVE</span>
    </div>
    <button id="toggleBypassBtn" class="secondary">Toggle Bypass</button>
  </div>

  <div class="section">
    <div class="section-title">Exam Tools</div>
    <div class="btn-group">
      <button id="copyActiveTabBtn">Copy Page Text</button>
      <button id="screenshotBtn">Screenshot</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Tab Manager</div>
    <div class="tab-status" id="examTabStatus">Exam Tab: Not Set</div>
    <div class="btn-row">
      <button id="setExamTabBtn" class="secondary">Set as Exam</button>
      <button id="goToExamBtn">Go to Exam</button>
    </div>
    
    <div class="tab-status" id="notesTabStatus">Notes Tab: Not Set</div>
    <div class="btn-row">
      <button id="setNotesTabBtn" class="secondary">Set as Notes</button>
      <button id="goToNotesBtn">Go to Notes</button>
    </div>
  </div>

  <img id="screenshotPreview" class="screenshot-preview" alt="Screenshot Preview">

  <div class="info">
    1. Open your Exam tab. Click "Set as Exam".<br>
    2. Open your Notes tab. Click "Set as Notes".<br>
    3. Use "Go to" buttons to switch instantly.
  </div>

  <script src="popup.js"></script>
</body>
</html>
